name: lint,
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm ci
      - name: lint
        run: npm run lint